# push と pull request のたびに単体テストを全部流す（npm run check）。
# main への push で通ったら、テスト環境に上げる（D1 のマイグレーションを当ててから wrangler deploy）。本番には上げない。
# 施設の設定（sites/）は公開しないので、GitHub の秘密の値 YOYAKU_SITES（sites/ を tar.gz にして base64 にしたもの）から戻す。
# テスト環境に上げる鍵は CLOUDFLARE_API_TOKEN（Workers と D1 の編集だけ）
name: check-and-deploy-test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check

  deploy-test:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SITE: yorozuya-test
      DB: yoyaku-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: 施設の設定を戻す
        env:
          YOYAKU_SITES: ${{ secrets.YOYAKU_SITES }}
        run: echo "$YOYAKU_SITES" | base64 -d | tar xz
      - name: テスト環境の D1 にマイグレーションを当てる
        run: npx wrangler d1 migrations apply "$DB" --remote -c "sites/$SITE/wrangler.jsonc"
      - name: テスト環境に上げる
        run: npx wrangler deploy -c "sites/$SITE/wrangler.jsonc" --message "GitHub Actions ${GITHUB_SHA::7}"
      - name: 配信中の物を1回読む
        run: curl -fsS "https://yoyaku-test.untronc-nao.workers.dev/api?action=ping"
